<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PW Pi Pro Web App</title>
    <meta name="description" content="Embedded PW-PIPRO web app with custom Telegram community link and real-time path synchronization." />
    <meta property="og:title" content="PW Pi Pro Web App" />
    <meta property="og:description" content="Embedded PW-PIPRO web app with custom Telegram community link and real-time path synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully silence harmless Vite HMR websocket disconnect warnings in sandboxed preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message?.includes('WebSocket closed') ||
          event.reason.message?.includes('failed to connect to websocket') ||
          String(event.reason).includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('failed to connect to websocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
